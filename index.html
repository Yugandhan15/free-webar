
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Free WebAR Experience</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f4f6f8;
      color: #18212f;
    }

    header { padding: 24px 12px 8px; }

    model-viewer {
      width: 100%;
      height: 65vh;
      min-height: 350px;
      background: #ffffff;
      --poster-color: #ffffff;
    }

    p { padding: 0 16px; }

    .hint {
      font-size: 14px;
      color: #526071;
    }
  </style>
</head>

<body>
  <header>
    <h1>My 3D Product</h1>
    <p>Rotate, zoom, and view the model in your space.</p>
  </header>

  <model-viewer
    src="./model.glb"
    alt="Interactive 3D product model"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-scale="auto"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    loading="eager">

    <p slot="ar-button">
      <!-- AR button is provided by model-viewer -->
    </p>

  </model-viewer>

  <p class="hint">
    On a compatible phone, tap the AR icon to enter your space.
  </p>
</body>
</html>
